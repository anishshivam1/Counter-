<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a060d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Divya Jaap - Spiritual Mantra Counter</title>
  <style>
    :root {
      --bg-primary: #120407;
      --bg-secondary: #1f0a10;
      --card-bg: rgba(45, 15, 23, 0.7);
      --accent: #ff9900;
      --accent-glow: rgba(255, 153, 0, 0.35);
      --gold: #f39c12;
      --text-main: #fcf6ec;
      --text-sub: #d1b8a5;
      --border-color: rgba(255, 153, 0, 0.25);
      --shadow-color: rgba(0, 0, 0, 0.6);
      --radius: 20px;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    [data-theme="indigo"] {
      --bg-primary: #0b0c1b;
      --bg-secondary: #131630;
      --card-bg: rgba(26, 30, 64, 0.7);
      --accent: #f1c40f;
      --accent-glow: rgba(241, 196, 15, 0.35);
      --gold: #f39c12;
      --text-main: #f0f3ff;
      --text-sub: #9ca6ce;
      --border-color: rgba(142, 68, 173, 0.3);
    }

    [data-theme="green"] {
      --bg-primary: #06140d;
      --bg-secondary: #0e2217;
      --card-bg: rgba(20, 48, 33, 0.7);
      --accent: #2ecc71;
      --accent-glow: rgba(46, 204, 113, 0.35);
      --gold: #f1c40f;
      --text-main: #f0fff5;
      --text-sub: #9bc4aa;
      --border-color: rgba(46, 204, 113, 0.25);
    }

    [data-theme="light"] {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --card-bg: #ffffff;
      --accent: #d35400;
      --accent-glow: rgba(211, 84, 0, 0.2);
      --gold: #f39c12;
      --text-main: #1a1a1a;
      --text-sub: #555555;
      --border-color: rgba(0, 0, 0, 0.12);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-title { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .main-container { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
    .mantra-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px; text-align: center; margin-bottom: 20px;
    }
    .deity-name { font-size: 0.9rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; }
    .mantra-text { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
    .mantra-meaning { font-size: 0.85rem; color: var(--text-sub); }
    
    .counter-area {
      display: flex; flex-direction: column; align-items: center; margin: 20px 0;
    }
    .counter-circle {
      width: 240px; height: 240px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 8px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      position: relative; transition: transform 0.05s ease;
    }
    .counter-circle:active { transform: scale(0.96); }
    .count-num { font-size: 3.5rem; font-weight: 800; color: var(--text-main); line-height: 1; }
    .count-label { font-size: 0.85rem; color: var(--text-sub); margin-top: 6px; }
    .mala-badge {
      margin-top: 12px; background: var(--border-color); padding: 4px 12px;
      border-radius: 12px; font-size: 0.85rem; font-weight: 600; color: var(--gold);
    }

    .audio-player-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 16px; margin-top: 20px;
    }
    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border-color); background: var(--bg-primary);
      color: var(--text-main); font-size: 0.9rem;
    }
    .btn {
      background: var(--accent); color: #000; border: none;
      padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    .audio-controls { display: flex; align-items: center; justify-content: space-between; }
    .audio-title { font-size: 0.9rem; color: var(--text-main); font-weight: 600; }
  </style>
</head>
<body data-theme="saffron">

  <header class="app-header">
    <div class="app-title">🌸 Divya Jaap</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Switch Theme">🎨</button>
      <button class="icon-btn" onclick="toggleVoice()" id="voiceBtn" title="Toggle Voice Speech">🔊</button>
    </div>
  </header>

  <div class="main-container">
    <div class="mantra-card">
      <div class="deity-name" id="deityLabel">Shri Radha-Krishna</div>
      <div class="mantra-text" id="mantraText">Shri Radha</div>
      <div class="mantra-meaning" id="mantraMeaning">The divine name of Radha Rani for love & devotion</div>
    </div>

    <div class="counter-area">
      <div class="counter-circle" id="tapBtn" onclick="handleTap()">
        <div class="count-num" id="countDisplay">0</div>
        <div class="count-label">TAP TO CHANT</div>
      </div>
      <div class="mala-badge" id="malaDisplay">Mala Completed: 0 (0 / 108)</div>
    </div>

    <div class="audio-player-card">
      <div class="search-box">
        <input type="text" id="musicQuery" class="search-input" placeholder="Search devotional songs...">
        <button class="btn" onclick="searchMusic()">Search</button>
      </div>
      <div class="audio-controls">
        <span class="audio-title" id="nowPlaying">Ambient Drone Active</span>
        <button class="btn" id="playPauseMusicBtn" onclick="toggleMusic()">Pause</button>
      </div>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('jaap_count') || '0');
    let malas = parseInt(localStorage.getItem('jaap_malas') || '0');
    let currentDeityIndex = 0;
    let voiceEnabled = true;

    const deities = [
      { name: "Shri Radha-Krishna", mantra: "Shri Radha", meaning: "Divine love & spiritual bliss" },
      { name: "Lord Shiva", mantra: "Om Namah Shivaya", meaning: "Adoration to the auspicious Lord Shiva" },
      { name: "Lord Rama", mantra: "Jai Shree Ram", meaning: "Victory to Lord Rama, symbol of righteousness" },
      { name: "Hanuman Ji", mantra: "Om Hanumate Namaha", meaning: "Salutations to the courageous Hanuman" }
    ];

    const synth = window.speechSynthesis;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function speakMantra(text) {
      if (!voiceEnabled || !synth) return;
      synth.cancel(); // Stop active queue
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.2;
      synth.speak(utterance);
    }

    function playBeep() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5 note
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function handleTap() {
      initAudio();
      count++;
      if (count % 108 === 0) {
        malas++;
        localStorage.setItem('jaap_malas', malas);
      }
      localStorage.setItem('jaap_count', count);
      updateDisplay();

      if (voiceEnabled) {
        speakMantra(deities[currentDeityIndex].mantra);
      } else {
        playBeep();
      }
    }

    function updateDisplay() {
      document.getElementById('countDisplay').innerText = count;
      const currentBeads = count % 108;
      document.getElementById('malaDisplay').innerText = `Mala Completed: ${malas} (${currentBeads} / 108)`;
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voiceBtn').innerText = voiceEnabled ? "🔊" : "🔇";
    }

    function toggleTheme() {
      const themes = ['saffron', 'indigo', 'green', 'light'];
      const current = document.body.getAttribute('data-theme') || 'saffron';
      const next = themes[(themes.indexOf(current) + 1) % themes.length];
      document.body.setAttribute('data-theme', next);
    }

    async function searchMusic() {
      const query = document.getElementById('musicQuery').value.trim();
      if (!query) return;
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const track = data.results[0];
          document.getElementById('nowPlaying').innerText = `${track.trackName} - ${track.artistName}`;
        }
      } catch (e) {
        console.error("Error searching music", e);
      }
    }

    // Initialize display on load
    updateDisplay();
  </script>
</body>
</html>
